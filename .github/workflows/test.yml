name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # copy.json rules, caption list in sync with index.html, crypto
      # vocabulary gate (plan section 6 and acceptance criteria).
      - run: npm run check-copy
      # Data contracts: schemas compile, runtime validators agree with them
      # on every fixture, published data files (if any) pass.
      - run: npm run check-data
      # Shipping gate: no caption still marked verify_before_ship, CTA approved.
      - run: npm run check-copy -- --ship
      - run: npx playwright install --with-deps chromium
      # Screenshot baselines are machine-specific (see tests/README.md);
      # CI runs the behavioural checks only.
      - run: npx playwright test --grep-invert @screenshot
