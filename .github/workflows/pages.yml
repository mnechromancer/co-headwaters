name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same gates as the Test workflow's copy checks: never publish a caption
      # still marked for re-verification, an unapproved CTA, or a caption list
      # out of sync with copy.json. (No npm install needed: check-copy uses
      # Node built-ins only.)
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check copy before publishing
        run: node scripts/check-copy.mjs --ship

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish only the site itself, not the repo: docs/ holds the internal
      # plan, scripts/ and tests/ are dev-only.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets data _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
